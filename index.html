<title>发卡商城 - 自动发卡，秒到账</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --primary:#635bff; --primary-dark:#5343d9; --bg:#f6f7fb; --card:#fff; --text:#1a1f36; --text-sub:#6b7280; --border:#e8e9f2; --success:#16a34a; --danger:#ef4444; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
  header { background: rgba(255,255,255,.9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
  .header-inner { display: flex; align-items: center; justify-content: space-between; height: 64px; }
  .logo { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .logo .logo-icon { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, #7a6cff, var(--primary)); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 18px; }
  .header-actions { display: flex; gap: 10px; }
  .btn { border: none; cursor: pointer; border-radius: 10px; font-size: 14px; padding: 9px 16px; transition: all .2s; font-family: inherit; }
  .btn-ghost { background: #fff; color: var(--text); border: 1px solid var(--border); }
  .btn-ghost:hover { border-color: var(--primary); color: var(--primary); }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-primary:disabled { opacity: .55; cursor: not-allowed; }
  .btn-block { width: 100%; padding: 13px; font-size: 15px; font-weight: 600; }
  .announcement { margin-top: 20px; padding: 13px 18px; border-radius: 14px; background: linear-gradient(135deg, #eef0ff, #f6ecff); border: 1px solid #e3e4ff; color: #4a44b8; font-size: 14px; display: flex; align-items: center; gap: 10px; }
  /* 两栏：左分类栏 + 右商品列表 */
  .shop-wrap { display: grid; grid-template-columns: 236px 1fr; gap: 18px; align-items: start; margin: 18px 0 0; }
  .side { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 12px;
    position: sticky; top: 80px; max-height: calc(100vh - 100px); overflow-y: auto; }
  .side-head { font-size: 13px; font-weight: 700; color: var(--text-sub); padding: 2px 6px 10px; display: flex; gap: 6px; }
  .cat-bar { display: flex; flex-direction: column; gap: 8px; }
  .cat-item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; font-family: inherit;
    border: 1px solid var(--border); background: var(--card); border-radius: 12px; padding: 9px 11px; cursor: pointer; transition: all .18s; }
  .cat-item:hover { border-color: #cfc9ff; transform: translateX(2px); }
  .cat-item.on { background: linear-gradient(135deg, var(--primary), #8a7bff); border-color: transparent; color: #fff; }
  .cat-icon { width: 30px; height: 30px; flex: 0 0 30px; border-radius: 9px; background: var(--bg);
    display: flex; align-items: center; justify-content: center; font-size: 16px; }
  .cat-item.on .cat-icon { background: rgba(255,255,255,.22); }
  .cat-text { min-width: 0; flex: 1; }
  .cat-text b { display: block; font-size: 13.5px; line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cat-text small { display: block; font-size: 11px; color: var(--text-sub); margin-top: 1px; }
  .cat-item.on .cat-text small { color: rgba(255,255,255,.82); }
  .main { min-width: 0; }
  .main .announcement { margin-top: 0; }

  /* 工具条 */
  .shop-tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 14px;
    background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 10px 12px; }
  .tools-title { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 7px; }
  .shop-search { flex: 1 1 200px; padding: 10px 14px; border: 1.5px solid var(--border); border-radius: 11px;
    font-size: 14px; font-family: inherit; outline: none; background: var(--bg); color: var(--text); }
  .shop-search:focus { border-color: var(--primary); background: #fff; }
  .shop-sort { padding: 9px 11px; border: 1.5px solid var(--border); border-radius: 11px; font-size: 13px;
    font-family: inherit; background: var(--card); color: var(--text); outline: none; cursor: pointer; }
  .view-toggle { display: flex; gap: 4px; background: var(--bg); border: 1px solid var(--border); border-radius: 11px; padding: 3px; }
  .view-toggle button { border: none; background: transparent; cursor: pointer; font-family: inherit; font-size: 14px;
    color: var(--text-sub); border-radius: 8px; padding: 5px 11px; line-height: 1; }
  .view-toggle button.on { background: var(--primary); color: #fff; }

  /* 列表视图：按分类分组的表格 */
  .rows { display: flex; flex-direction: column; gap: 16px; margin: 16px 0 8px; }
  .pcard { background: var(--card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
  .pcard-head { display: flex; align-items: center; gap: 10px; padding: 13px 18px; border-bottom: 1px solid var(--border);
    background: linear-gradient(135deg, #f4f3ff, #eef4ff); }
  .pcard-icon { width: 30px; height: 30px; border-radius: 9px; background: #fff; border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; font-size: 16px; }
  .pcard-head h3 { font-size: 15px; }
  .pcard-head small { font-size: 11.5px; color: var(--text-sub); margin-left: auto; }
  .ptable { width: 100%; border-collapse: collapse; }
  .ptable th { text-align: left; font-size: 12px; font-weight: 600; color: var(--text-sub); padding: 10px 14px; background: #fbfbfe; }
  .ptable td { padding: 12px 14px; border-top: 1px solid var(--border); font-size: 13.5px; vertical-align: middle; }
  .ptable tbody tr:hover { background: #f8f8ff; }
  .ptable th.c-stock, .ptable th.c-sold, .ptable th.c-buy { text-align: right; }
  .ptable td.c-stock, .ptable td.c-sold { text-align: right; font-variant-numeric: tabular-nums; color: var(--text-sub); }
  .ptable td.c-buy { text-align: right; }
  .ptable td.c-stock.ok { color: var(--success); font-weight: 600; }
  .ptable td.c-stock.bad { color: var(--danger); font-weight: 700; }
  .c-price { width: 96px; }
  .ptable td.c-price { color: #f5572b; font-weight: 700; white-space: nowrap; }
  .c-stock { width: 84px; } .c-sold { width: 80px; } .c-buy { width: 78px; }
  .row-icon { display: inline-flex; width: 26px; height: 26px; border-radius: 8px; background: var(--bg);
    border: 1px solid var(--border); align-items: center; justify-content: center; font-size: 14px; margin-right: 10px; vertical-align: middle; }
  .cell-name { max-width: 0; }
  .cell-name .cell-in { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .cell-name .row-icon { margin-right: 0; flex: none; }
  .cell-name .row-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-name { border: none; background: none; padding: 0; font-family: inherit; font-size: 13.5px; color: var(--text);
    cursor: pointer; text-align: left; line-height: 1.45; }
  .row-name:hover { color: var(--primary); text-decoration: underline; }
  .buy-link { border: 1px solid var(--primary); background: #fff; color: var(--primary); border-radius: 9px;
    padding: 5px 14px; font-size: 13px; cursor: pointer; font-family: inherit; transition: all .18s; }
  .buy-link:hover { background: var(--primary); color: #fff; }
  .buy-link:disabled { border-color: var(--border); color: #b0b4c3; cursor: not-allowed; }
  .shop-count { font-size: 12.5px; color: var(--text-sub); margin: 14px 2px 0; }
  .more-row { text-align: center; margin: 18px 0 40px; }
  .more-row .btn { min-width: 200px; }

  /* 商品详情页：#/g/<id> */
  .detail { max-width: 880px; margin: 0 auto; padding-bottom: 46px; }
  .crumb { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12.5px; color: var(--text-sub); margin: 16px 2px 14px; }
  .crumb-link { border: none; background: none; padding: 0; font-family: inherit; font-size: 12.5px; color: var(--primary); cursor: pointer; }
  .crumb-link:hover { text-decoration: underline; }
  .crumb-sep { color: #c7cbdb; }
  .crumb-cur { max-width: 60vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dhero { position: relative; display: flex; gap: 18px; align-items: center; background: linear-gradient(135deg, #f0edff, #eaf3ff);
    border: 1px solid var(--border); border-radius: 18px; padding: 26px 24px; }
  .dcover { font-size: 62px; line-height: 1; flex: 0 0 auto; }
  .dbadge { position: absolute; top: 14px; right: 16px; font-size: 11.5px; background: rgba(99,91,255,.12); color: var(--primary); padding: 4px 11px; border-radius: 20px; }
  .dhead { min-width: 0; }
  .dhead h1 { font-size: 20px; line-height: 1.45; word-break: break-word; }
  .dtags { font-size: 12.5px; color: var(--text-sub); margin-top: 8px; }
  .dbuy { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 8px 22px 22px; margin-top: 16px; }
  .dbuy-row { display: flex; align-items: center; gap: 14px; padding: 15px 0; border-bottom: 1px dashed var(--border); }
  .dbuy-label { flex: 0 0 76px; font-size: 13px; color: var(--text-sub); }
  .dbuy-price { color: #f5572b; font-size: 30px; font-weight: 700; line-height: 1; }
  .dbuy-price small { font-size: 16px; margin-right: 2px; }
  .dbuy-sold { font-size: 12.5px; color: var(--text-sub); margin-left: auto; }
  .dbuy-pills { display: flex; gap: 8px; flex-wrap: wrap; }
  .pill { font-size: 12px; padding: 5px 12px; border-radius: 20px; background: var(--bg); color: var(--text-sub); border: 1px solid var(--border); }
  .pill.ok { background: #eafaf0; color: var(--success); border-color: #cdeeda; font-weight: 600; }
  .pill.bad { background: #fdeeef; color: var(--danger); border-color: #f6d6d8; font-weight: 700; }
  .dbuy-total { color: #f5572b; font-size: 21px; font-weight: 700; }
  .dbuy .btn-block { margin-top: 18px; }
  .dcard { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 6px 22px 18px; margin-top: 16px; }
  .dcard h3 { font-size: 15.5px; padding: 16px 0 4px; border-bottom: 1px solid var(--border); margin-bottom: 4px; }
  /* 商品介绍分小节 */
  .modal.modal-wide { max-width: 580px; }
  .info-block { padding: 11px 0; border-bottom: 1px dashed var(--border); }
  .info-block:last-child { border-bottom: none; }
  .info-label { font-size: 12px; color: var(--text-sub); margin-bottom: 4px; font-weight: 600; }
  .info-value { font-size: 14px; line-height: 1.75; word-break: break-word; }
  .info-value.pre { white-space: pre-line; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 18px; margin: 22px 0 40px; }
  .goods-card { background: var(--card); border-radius: 16px; padding: 20px; border: 1px solid var(--border); transition: all .25s; position: relative; }
  .goods-card:hover { transform: translateY(-4px); box-shadow: 0 12px 30px rgba(99,91,255,.12); border-color: #d8d5ff; }
  .goods-cover { height: 88px; border-radius: 12px; margin-bottom: 14px; background: linear-gradient(135deg, #f0edff, #e8f4ff); display: flex; align-items: center; justify-content: center; font-size: 44px; }
  .goods-category { position: absolute; top: 14px; right: 14px; font-size: 11px; background: rgba(99,91,255,.1); color: var(--primary); padding: 3px 9px; border-radius: 20px; }
  .goods-name { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
  .goods-desc { font-size: 12px; color: var(--text-sub); margin-bottom: 14px; min-height: 32px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .goods-meta { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
  .goods-price { color: #f5572b; font-size: 22px; font-weight: 700; }
  .goods-price small { font-size: 13px; font-weight: 600; }
  .goods-sold { font-size: 12px; color: var(--text-sub); }
  .goods-stock { font-size: 12px; color: var(--text-sub); margin-bottom: 12px; }
  .goods-stock.low { color: var(--danger); }
  .empty { text-align: center; color: var(--text-sub); padding: 60px 0; font-size: 14px; }
  footer { text-align: center; color: #b0b4c3; font-size: 12px; padding: 30px 0 40px; }
  .modal-mask { display: none; position: fixed; inset: 0; background: rgba(20,22,40,.45); z-index: 200; align-items: center; justify-content: center; padding: 20px; }
  .modal-mask.show { display: flex; }
  .modal { background: #fff; border-radius: 18px; padding: 26px; width: 100%; max-width: 420px; animation: pop .25s ease; max-height: 88vh; overflow-y: auto; }
  @keyframes pop { from { transform: scale(.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .modal h3 { font-size: 18px; margin-bottom: 18px; display: flex; justify-content: space-between; align-items: center; }
  .modal .close { cursor: pointer; font-size: 20px; color: #9aa0b5; background: none; border: none; }
  .form-item { margin-bottom: 16px; }
  .form-item label { display: block; font-size: 13px; color: var(--text-sub); margin-bottom: 7px; }
  .form-item input, .form-item textarea { width: 100%; padding: 11px 13px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 14px; font-family: inherit; outline: none; transition: border .2s; }
  .form-item input:focus { border-color: var(--primary); }
  .order-summary { background: var(--bg); border-radius: 12px; padding: 14px; margin-bottom: 16px; display: flex; gap: 12px; align-items: center; }
  .order-summary .cover { font-size: 32px; }
  .order-summary .name { font-weight: 600; font-size: 14px; }
  .order-summary .sub { font-size: 12px; color: var(--text-sub); margin-top: 3px; }
  .qty-row { display: flex; align-items: center; gap: 14px; }
  .qty-btn { width: 34px; height: 34px; border-radius: 9px; border: 1.5px solid var(--border); background: #fff; font-size: 17px; cursor: pointer; color: var(--text); }
  .qty-btn:hover { border-color: var(--primary); color: var(--primary); }
  .qty-num { font-size: 16px; font-weight: 600; min-width: 24px; text-align: center; }
  .total-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 2px 16px; }
  .total-row .label { font-size: 14px; color: var(--text-sub); }
  .total-row .amount { color: #f5572b; font-size: 24px; font-weight: 700; }
  .pay-info { background: var(--bg); border-radius: 12px; padding: 16px; margin-bottom: 18px; }
  .pay-info .row { display: flex; justify-content: space-between; font-size: 13px; padding: 5px 0; color: var(--text-sub); }
  .pay-info .row b { color: var(--text); font-weight: 600; }
  .pay-amount { text-align: center; margin-bottom: 18px; }
  .pay-amount .num { font-size: 36px; font-weight: 700; color: var(--text); }
  .pay-amount .num small { font-size: 18px; color: #f5572b; }
  .demo-tip { font-size: 12px; color: #b8860b; background: #fffbef; border: 1px solid #fdeeb8; border-radius: 9px; padding: 8px 12px; margin-bottom: 14px; text-align: center; }
  .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .result-head { text-align: center; margin-bottom: 18px; }
  .result-head .ok-icon { width: 54px; height: 54px; margin: 0 auto 10px; border-radius: 50%; background: #e8f9ef; color: var(--success); font-size: 28px; display: flex; align-items: center; justify-content: center; }
  .card-secret { border: 1.5px dashed #c9c6f5; border-radius: 10px; padding: 11px 13px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; gap: 10px; background: #fafaff; }
  .card-secret code { font-family: Consolas, Monaco, monospace; font-size: 13px; word-break: break-all; }
  .card-secret .copy-one { flex-shrink: 0; border: 1px solid var(--border); background: #fff; border-radius: 7px; padding: 4px 10px; font-size: 12px; cursor: pointer; color: var(--primary); }
  .card-secret .copy-one:hover { background: #f0edff; }
  #toast { position: fixed; top: 80px; left: 50%; transform: translateX(-50%) translateY(-16px); background: #1a1f36; color: #fff; padding: 10px 22px; border-radius: 10px; font-size: 14px; opacity: 0; pointer-events: none; transition: all .3s; z-index: 999; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  @media (max-width: 560px) { .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; } .goods-card { padding: 14px; } .goods-cover { height: 64px; font-size: 34px; }
    .dhero { flex-direction: column; align-items: flex-start; gap: 12px; padding: 20px 18px; } .dcover { font-size: 48px; } .dhead h1 { font-size: 17px; }
    .dbuy-row { flex-wrap: wrap; gap: 10px; } .dbuy-label { flex: 0 0 100%; } .dbuy-sold { margin-left: 0; } }
  @media (max-width: 900px) {
    .shop-wrap { grid-template-columns: 1fr; gap: 12px; }
    .side { position: static; max-height: none; padding: 10px; }
    .cat-bar { flex-direction: row; overflow-x: auto; padding-bottom: 4px; }
    .cat-item { flex: 0 0 auto; min-width: 150px; }
    .cat-item:hover { transform: none; }
    .ptable th.c-sold, .ptable td.c-sold { display: none; }
    .ptable th, .ptable td { padding: 10px; }
    .c-price { width: 78px; } .c-buy { width: 64px; }
  }
  .hint-line { font-size:13px; color:var(--text-sub); text-align:center; padding:10px 0; line-height:1.6; }
.notice { background:#fffbef; border:1px solid #fdeeb8; border-radius:14px; padding:14px 18px 8px; margin-top:14px; }

.tg { color:var(--primary); text-decoration:none; font-weight:600; }

.me-link{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:4px 0 10px}

  padding:9px 11px;font-size:13px;word-break:break-all}
.me-note{font-size:12.5px;color:var(--text-sub);margin:6px 0}
.me-pills{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
.me-sub{font-weight:700;font-size:13.5px;margin:16px 0 6px;color:var(--text)}
.me-line{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--border);font-size:14px}
.me-line small{color:var(--text-sub)}
@media (max-width:560px){.me-kv,.me-line{font-size:13.5px}}


/* ---------- 移动端：底部导航 + 分类抽屉（照货源站那种排布） ---------- */
.tabbar { display: none; }
.cat-pill { display: none; }
.ptable td .lab { display: none; font-style: normal; font-weight: 400; color: var(--text-sub); }
.sheet-mask { position: fixed; inset: 0; background: rgba(15, 23, 42, .45); z-index: 96; opacity: 0; pointer-events: none; transition: opacity .2s; }
.sheet-mask.on { opacity: 1; pointer-events: auto; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 74vh; background: #fff; border-radius: 18px 18px 0 0; display: flex; flex-direction: column; transform: translateY(100%); transition: transform .22s ease; }
.sheet-mask.on .sheet { transform: translateY(0); }
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--border); font-size: 15px; font-weight: 600; }
.sheet-list { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 4px 0 18px; }
.sheet-item { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; border-bottom: 1px solid #f1f5f9; background: transparent; font: inherit; text-align: left; padding: 12px 16px; cursor: pointer; }
.sheet-item .cat-icon { flex: 0 0 34px; width: 34px; height: 34px; border-radius: 9px; background: #f1f5f9; display: flex; align-items: center; justify-content: center; font-size: 18px; }
.sheet-item b { font-size: 14.5px; font-weight: 600; }
.sheet-item small { color: var(--text-sub); font-weight: 400; margin-left: 5px; }
.sheet-item .arrow { margin-left: auto; color: #cbd5e1; font-size: 18px; }
.sheet-item.on b { color: var(--primary); }
@media (max-width: 860px) {
  body { padding-bottom: 62px; }
  header .btn { padding: 6px 10px; font-size: 12.5px; }
  header a[href="totp.html"], header [data-act="open-query"] { display: none; }
  .side { display: none; }
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 97; display: grid; grid-template-columns: repeat(5, 1fr); background: rgba(255, 255, 255, .97); border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom); }
  .tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: 0; background: transparent; font: inherit; font-size: 11.5px; color: var(--text-sub); padding: 7px 0 6px; cursor: pointer; text-decoration: none; }
  .tab-ico { font-size: 18px; line-height: 1; }
  .tab.on { color: var(--primary); font-weight: 600; }
  .cat-pill { display: flex; align-items: center; gap: 6px; margin: 8px 0 0; font-size: 12.5px; color: var(--text-sub); }
  .cat-pill b { color: var(--primary); font-weight: 600; }
  .cat-pill button { margin-left: auto; border: 1px solid var(--border); background: #fff; border-radius: 20px; padding: 3px 10px; font-size: 12px; cursor: pointer; color: var(--text-sub); }
  .pcard-head { padding: 12px 14px; }
  .ptable thead { display: none; }
  .ptable, .ptable tbody { display: block; }
  .ptable tr { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding: 11px 14px; border-bottom: 1px solid #f1f5f9; }
  .ptable td { display: block; padding: 0; border: 0; }
  .ptable td.cell-name { flex: 1 1 100%; }
  .ptable td.c-price { flex: 0 0 auto; color: var(--danger); font-weight: 700; }
  .ptable td.c-stock, .ptable td.c-sold { flex: 0 0 auto; font-size: 12.5px; color: var(--text-sub); }
  .ptable td .lab { display: inline; }
  .ptable td.c-buy { flex: 0 0 auto; margin-left: auto; }
}
</style>

<body>

<header>
  <div class="container header-inner">
    <div class="logo"><span class="logo-icon">🛍️</span><span id="siteName">发卡商城</span></div>
    <div class="header-actions">
      <a class="btn btn-ghost" href="totp.html">2FA 验证码</a>
      <button type="button" class="btn btn-ghost" id="langBtn" data-act="toggle-lang">EN</button>
      <button type="button" class="btn btn-ghost" data-act="open-account">登录 / 注册</button>
      <button type="button" class="btn btn-ghost" data-act="open-query">订单查询</button>
      <button type="button" class="btn btn-ghost" data-act="goto-admin">管理后台</button>
    </div>
  </div>
</header>

<div class="container">
  <div class="shop-wrap" id="shopWrap">
    <aside class="side">
      <div class="side-head"><span>📁</span><span>商品分类</span></div>
      <div class="cat-bar" id="catBar"></div>
    </aside>
    <main class="main">
      <div class="announcement"><span>📢</span><span id="announcement">正在加载...</span></div>
      <div id="homeNotice"></div>
      <div class="shop-tools">
        <span class="tools-title"><span>≡</span><span>商品列表</span></span>
        <input type="search" id="searchBox" class="shop-search" maxlength="60" autocomplete="off"
          placeholder="搜索你想要的商品，例如 Gmail、苹果、会员">
        <select id="sortBox" class="shop-sort">
          <option value="new">最新上架</option>
          <option value="hot">销量优先</option>
          <option value="cheap">价格从低到高</option>
          <option value="exp">价格从高到低</option>
        </select>
        <div class="view-toggle">
          <button type="button" id="viewListBtn" title="列表视图">☰</button>
          <button type="button" id="viewGridBtn" title="卡片视图">▦</button>
        </div>
      </div>
      <div class="cat-pill" id="catPill" style="display:none"></div>
      <div class="shop-count" id="shopCount"></div>
      <div class="rows" id="goodsGrid"></div>
      <div class="more-row" id="moreRow" style="display:none">
        <button type="button" class="btn btn-ghost" id="moreBtn">加载更多</button>
      </div>
    </main>
  </div>
  <div class="detail" id="detailView" style="display:none"></div>
  <div class="detail" id="meView" style="display:none"></div>
</div>

<footer>本站商品均为虚拟商品，一经售出概不退换</footer>

<!-- 移动端底部导航（桌面端用 CSS 隐藏） -->
<nav class="tabbar" id="tabBar" aria-label="导航">
  <button type="button" class="tab on" id="tabHome" data-tab="home"><span class="tab-ico">🏪</span><span>首页</span></button>
  <button type="button" class="tab" id="tabCat" data-tab="cat"><span class="tab-ico">🗂️</span><span>分类</span></button>
  <button type="button" class="tab" data-act="open-query"><span class="tab-ico">🧾</span><span>订单</span></button>
  <a class="tab" href="totp.html"><span class="tab-ico">🛡️</span><span>2FA</span></a>
  <button type="button" class="tab" id="tabMe" data-tab="me"><span class="tab-ico">👤</span><span>我的</span></button>
</nav>

<!-- 移动端分类抽屉：手机端没有左侧分类栏，分类从这里选 -->
<div class="sheet-mask" id="catSheet">
  <div class="sheet">
    <div class="sheet-head"><span>商品分类</span><button type="button" class="close" id="catSheetClose">✕</button></div>
    <div class="sheet-list" id="catSheetList"></div>
  </div>
</div>

<!-- 购买弹窗 -->
<div class="modal-mask" id="buyModal">
  <div class="modal">
    <h3>确认购买<button type="button" class="close" data-close="buyModal">✕</button></h3>
    <div class="order-summary" id="buySummary"></div>
    <div class="form-item">
      <label>购买数量<span id="buyStockHint">（剩余库存 - 张）</span></label>
      <div class="qty-row">
        <button type="button" class="qty-btn" id="qtyMinus">−</button>
        <span class="qty-num" id="qtyNum">1</span>
        <button type="button" class="qty-btn" id="qtyPlus">＋</button>
      </div>
    </div>
    <div class="form-item"><label>接收邮箱（用于查询订单，请填写你本人的邮箱）</label><input type="email" id="buyEmail" placeholder="例如：you@example.com" maxlength="254" autocomplete="email"></div>
    <div id="buyNotice"></div>
    <div class="total-row"><span class="label">合计</span><span class="amount">¥ <span id="totalPrice">0.00</span></span></div>
    <button type="button" class="btn btn-primary btn-block" id="submitOrderBtn">立即下单</button>
  </div>
</div>

<!-- 支付弹窗：本页不具备"支付成功"的判定能力，只能等数据库确认 -->
<div class="modal-mask" id="payModal">
  <div class="modal">
    <h3>订单支付<button type="button" class="close" data-close="payModal">✕</button></h3>
    <div class="pay-amount"><small>¥</small> <span class="num" id="payAmount">0.00</span></div>
    <div class="pay-info">
      <div class="row"><span>订单编号</span><b id="payOrderId">-</b></div>
      <div class="row"><span>商品名称</span><b id="payGoodsName">-</b></div>
      <div class="row"><span>数量</span><b id="payQty">-</b></div>
    </div>
    <div class="pay-balance" id="balanceRow" style="display:none">
      <div class="row"><span>账户余额</span><b id="balanceNum">¥0.00</b></div>
      <button type="button" class="btn btn-primary btn-block" id="balancePayBtn" data-act="balance-pay">用余额支付，秒发货</button>
      <button type="button" class="btn btn-ghost btn-block" id="goRechargeBtn" data-act="open-recharge" style="margin-top:8px">余额不够？去充值</button>
    </div>
    <div class="demo-tip" id="payStatus">等待支付结果…</div>
    <button type="button" class="btn btn-primary btn-block" id="payRefreshBtn">我已完成支付，刷新状态</button>
  </div>
</div>

<!-- 充值弹窗（逻辑在 member.js，CSP 禁内联脚本） -->
<div class="modal-mask" id="rechargeModal">
  <div class="modal">
    <h3><span id="rcTitle">充值余额</span><button type="button" class="close" data-close="rechargeModal">✕</button></h3>
    <div class="pay-info">
      <div class="row"><span>当前余额</span><b id="rcBalance">¥0.00</b></div>
    </div>
    <div class="form-item"><label>选择金额</label><div class="rc-amts" id="rcAmounts"></div></div>
    <div class="form-item"><label>其他金额（元）</label>
      <input type="number" id="rcCustom" min="1" step="1" maxlength="8" placeholder="也可以自己填" autocomplete="off" /></div>
    <div class="demo-tip" id="rcNotice" style="display:none"></div>
    <div id="rcBody"></div>
    <button type="button" class="btn btn-primary btn-block" id="rcGoBtn" data-act="recharge-start">生成充值单</button>
    <div class="demo-tip" id="rcMsg" style="display:none"></div>
  </div>
</div>

<!-- 结果弹窗 -->
<div class="modal-mask" id="resultModal">
  <div class="modal">
    <h3>购买成功<button type="button" class="close" data-close="resultModal">✕</button></h3>
    <div class="result-head">
      <div class="ok-icon" id="resultIcon">✓</div>
      <div style="font-size:15px;font-weight:600" id="resultTitle">卡密已自动发货，请及时复制保存</div>
      <div style="font-size:12px;color:var(--text-sub);margin-top:5px">订单号：<span id="resultOrderId"></span></div>
    </div>
    <div id="cardList"></div>
    <button type="button" class="btn btn-primary btn-block" style="margin-top:8px" id="copyAllBtn">一键复制全部卡密</button>
    <button type="button" class="btn btn-primary btn-block" style="margin-top:8px;display:none" id="refreshCardsBtn">刷新卡密（货源方出货中）</button>
    <div class="hint-line">没看到卡密？稍后用订单号 + 下单邮箱在「订单查询」里随时查看。客服 TG：<a class="tg" href="https://t.me/abjb1" target="_blank" rel="noopener noreferrer">@abjb1</a></div>
  </div>
</div>

<!-- 订单查询弹窗 -->
<div class="modal-mask" id="queryModal">
  <div class="modal">
    <h3>订单查询<button type="button" class="close" data-close="queryModal">✕</button></h3>
    <div class="form-item"><label>订单编号</label><input type="text" id="queryOrderId" placeholder="下单时生成的订单编号" maxlength="40" autocomplete="off"></div>
    <div class="form-item"><label>下单邮箱</label><input type="email" id="queryEmail" placeholder="下单时填写的邮箱" maxlength="254" autocomplete="email"></div>
    <button type="button" class="btn btn-primary btn-block" id="doQueryBtn">查询订单</button>
    <div id="queryResult" style="margin-top:16px"></div>
  </div>
</div>

<!-- 会员登录 / 注册弹窗（逻辑在 member.js，CSP 禁内联脚本） -->
<div class="modal-mask" id="authModal">
  <div class="modal">
    <h3><span id="authTitleText">会员登录</span><button type="button" class="close" data-close="authModal">✕</button></h3>
    <div class="auth-tabs">
      <button type="button" class="auth-tab on" data-authtab="login">登录</button>
      <button type="button" class="auth-tab" data-authtab="signup">注册</button>
    </div>
    <div class="form-item"><label>用户名</label><input type="text" id="authUser" maxlength="20" autocomplete="username"
      placeholder="4-20 位字母、数字或下划线"></div>
    <div class="form-item"><label>密码</label><input type="password" id="authPass" maxlength="64" autocomplete="current-password"
      placeholder="至少 6 位"></div>
    <div class="form-item" id="authPass2Item" style="display:none"><label>确认密码</label>
      <input type="password" id="authPass2" maxlength="64" autocomplete="new-password"></div>
    <div class="form-item" id="authRefItem" style="display:none"><label>邀请码（选填）</label>
      <input type="text" id="authRef" maxlength="16" placeholder="朋友给你的 8 位邀请码"></div>
    <button type="button" class="btn btn-primary btn-block" id="authBtn" data-act="auth-submit">登录</button>
    <div style="text-align:center;margin-top:10px">
      <button type="button" class="btn btn-ghost btn-sm" id="authSwap" data-act="auth-swap">还没有账号？注册一个</button>
    </div>
    <div class="auth-msg" id="authHint"></div>
    <div class="auth-msg bad" id="authMsg"></div>
  </div>
</div>

<footer class="foot">
  <p>所有商品只用来社交和沟通贸易，不做其他违法活动。全部交易只走本站平台，勿私下交易。</p>
  <p>客服 TG：<a class="tg" href="https://t.me/abjb1" target="_blank" rel="noopener noreferrer">@abjb1</a></p>
</footer>
<div id="toast"></div>
